<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- ✨ [2026-10-09] 인쇄 미리보기(LibreOffice) — 한글·워드 문서에 자주 쓰이는 윈도우/한컴 글꼴이 서버에 없어서
     라틴 글꼴(DejaVu)과 중국어 글꼴(Noto SC)로 그려지며 줄바꿈·쪽 나눔이 어긋났다.
     비슷한 한국어 글꼴로 바꿔 그린다: 고딕 계열 → 나눔고딕/나눔바른고딕, 명조 계열 → 나눔명조. -->
<fontconfig>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumGothic</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>NanumMyeongjo</string></edit>
  </match>

  <alias binding="same"><family>맑은 고딕</family><prefer><family>NanumBarunGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>Malgun Gothic</family><prefer><family>NanumBarunGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>함초롬돋움</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>HCR Dotum</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>한컴돋움</family><prefer><family>NanumGothic</family><family>Noto Sans CJK KR</family></prefer></alias>
  <alias binding="same"><family>굴림</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>Gulim</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>굴림체</family><prefer><family>NanumGothicCoding</family></prefer></alias>
  <alias binding="same"><family>돋움</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>Dotum</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>돋움체</family><prefer><family>NanumGothicCoding</family></prefer></alias>
  <alias binding="same"><family>HY견고딕</family><prefer><family>NanumSquare</family></prefer></alias>
  <alias binding="same"><family>HY헤드라인M</family><prefer><family>NanumSquare</family></prefer></alias>
  <alias binding="same"><family>휴먼고딕</family><prefer><family>NanumGothic</family></prefer></alias>
  <alias binding="same"><family>한컴 고딕</family><prefer><family>NanumGothic</family></prefer></alias>

  <alias binding="same"><family>함초롬바탕</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>HCR Batang</family><prefer><family>NanumMyeongjo</family><family>Noto Serif CJK KR</family></prefer></alias>
  <alias binding="same"><family>한컴바탕</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>바탕</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>Batang</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>바탕체</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>궁서</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>신명조</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>휴먼명조</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>HY신명조</family><prefer><family>NanumMyeongjo</family></prefer></alias>
  <alias binding="same"><family>한양신명조</family><prefer><family>NanumMyeongjo</family></prefer></alias>
</fontconfig>
